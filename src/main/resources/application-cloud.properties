# Cloud profile for Render deployment
# Uses built-in persistent H2 database by default (Zero configuration required)
# If custom MySQL is provided via DB_URL, it automatically connects to MySQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:file:/app/data/studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
