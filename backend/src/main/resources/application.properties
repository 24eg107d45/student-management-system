spring.application.name=student-management-system
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration (Defaults to local MySQL aimldg, can be overridden by cloud environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aimldg?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false