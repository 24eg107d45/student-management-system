# Cloud profile for Render deployment
# Auto-detects database from DB_URL:
# 1. Zero-config default: In-memory H2 database (starts instantly on Render with no setup needed)
# 2. External MySQL / Aiven: If DB_URL, DB_USERNAME, DB_PASSWORD are set in Render, it seamlessly connects to MySQL!
spring.datasource.url=${DB_URL:jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true
